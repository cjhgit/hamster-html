<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamster · aBowman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Flash 仓鼠的 HTML Canvas 复刻">
    <div class="canvas-frame">
      <canvas id="hamster" width="742" height="550" tabindex="0" aria-describedby="feeding-hint" aria-label="宠物仓鼠。点击空白处投食，按住拖动食物，点击跑轮中心让仓鼠上跑轮。"></canvas>
      <a id="brand-link" aria-label="访问原作者 aBowman 的仓鼠页面"></a>
    </div>
    <p id="feeding-hint">点击上方画面中的空白处，给仓鼠投喂食物</p>
  </main>
  <script src="src/runtime.js"></script>
  <script src="src/original.js"></script>
  <script src="src/app.js"></script>
